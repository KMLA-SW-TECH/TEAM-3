<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo Clone</title>
    <link rel="stylesheet" href="css/style.css">    

</head>
<body>
    <header class = "header">  
        <div class="logo">
            Duolingo Clone</div>
        </header>
    <section class="hero">

     <img class="부엉1-img" src="img/부엉1.png" alt="BuoongBuoong">


    <div class="hero-text">
      <h1>How much do you know in Japanese? </h1>     

    </div>
    
    </section>
    <section class="buttons">

        <div class="level">
            <img class="l0-img" src="img/l0.png" alt="Level 0">
            <h3>I am learning Japanese for the first time</h3>
        </div>

        <div class="level">
            <img class="l1-img" src="img/l1.png" alt="Level 1">
            <h3>I know a few frequently used words</h3>
        </div>

        <div class="level">
            <img class="l2-img" src="img/l2.png" alt="Level 2">
            <h3>I can have a basic conversation</h3>
        </div>

        <div class="level">
            <img class="l3-img" src="img/l3.png" alt="Level 3">
            <h3>We can talk about various topics</h3>
        </div>

        <div class="level">
            <img class="l4-img" src="img/l4.png" alt="Level 4">
            <h3>We can discuss most topics in detail</h3>
        </div>



    </section>

      




   


</body>
</html>
